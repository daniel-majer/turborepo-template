name: Bug report
description: Report a reproducible problem in the template.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here. Use a private security advisory.
  - type: input
    id: revision
    attributes:
      label: Template revision
      description: Commit SHA or release tag where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, commands or repository link.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, Bun and Docker versions when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials and personal data before pasting logs.
      render: shell
