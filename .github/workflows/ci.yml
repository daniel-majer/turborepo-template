name: CI

on:
  push:
    branches: [main]
  pull_request:

# Git hooks are pointless here - CI runs the same checks directly.
env:
  HUSKY: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # On a PR, check only what changed against the base branch.
      - name: Check (pull request)
        if: github.event_name == 'pull_request'
        run: bun x turbo run quality check-types build --affected

      # On main, --affected would compare main against itself and run nothing,
      # so check everything.
      - name: Check (main)
        if: github.event_name == 'push'
        run: bun x turbo run quality check-types build

      - run: bun x turbo boundaries
