name: CI

on:
  # TODO(template): Adjust the branches and events to match your workflow.
  push:
    branches: [main]
  pull_request:

# Git hooks are pointless here - CI runs the same checks directly.
env:
  HUSKY: 0
  # TODO(template): Replace this with the frontend URL used during CI builds.
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:3001"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # On a PR only run tasks for packages that changed against the base branch.
  # On main, --affected would compare main against itself and run nothing,
  # so run everything.
  TURBO_AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - run: bun x turbo run quality check-types $TURBO_AFFECTED
      # `next typegen` and `next build` both write into .next, so keep the two
      # turbo invocations sequential.
      - run: bun x turbo run build $TURBO_AFFECTED
      - run: bun x turbo boundaries

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - run: bun x turbo run test $TURBO_AFFECTED

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # apps/be/package.json `test:e2e` starts its own Postgres + Redis via
      # docker-compose.test.yml (Docker is preinstalled on ubuntu-latest).
      - run: bun x turbo run test:e2e $TURBO_AFFECTED
