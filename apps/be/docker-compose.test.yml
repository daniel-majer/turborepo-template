# Throwaway Postgres + Redis for e2e/integration tests. Runs next to the dev
# stack on different ports and keeps no volumes, so every run starts clean.
# TODO(template): Change this together with the dev Compose project name.
name: turborepo-template-be-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Keep these values aligned with the committed `.env.test` file.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Hardcoded: Compose would interpolate ${...} from the dev `.env`,
      # not from the `environment:` block above.
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
